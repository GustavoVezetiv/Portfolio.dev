name: Sync pages indexes

on:
  push:
    branches: ["main"]
    paths:
      - "pages/**"
      - "scripts/sync_pages_indexes.py"
      - ".github/workflows/sync-pages-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar e sincronizar index.html
        run: python scripts/sync_pages_indexes.py

      - name: Commitar indexes gerados
        shell: bash
        run: |
          if git diff --quiet -- pages; then
            echo "Nenhum index.html mudou."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages
          git commit -m "chore: sync pages index files"
          git push
